    html { background-color: #111713; }
    html[data-screen="game"], html[data-screen="game"] body { background: #141512; overscroll-behavior: none; }
    #GameCanvas { touch-action: none; }
    #pack-arrival {
      position: fixed; z-index: 10; inset: 0; margin: 0;
      background: linear-gradient(#06161545, #06161545), url("packs/arrival/stage.webp") center / cover no-repeat,
                  #12221f var(--arrival-landscape) center / cover no-repeat;
      opacity: 1; transition: opacity .16s ease-out, visibility 0s .16s;
    }
    /* The sealed wrapper shares the centre and size of PackDemo.layout in each orientation. */
    #pack-arrival::before {
      content: ''; position: absolute; left: 50%; top: 54.4167%;
      height: 46.107vh; aspect-ratio: 344 / 610; transform: translate(-50%, -50%);
      background: var(--arrival-wrapper, none) center / contain no-repeat,
                  var(--arrival-miniature, none) var(--arrival-strip-position, 0%) center / 600% 100% no-repeat;
    }
    @media (min-aspect-ratio: 113/100) {
      #pack-arrival::before { left: calc(50% + min(17vw, 30.8333vh)); top: 50.6667%; height: 64.5583vh; }
    }
    @media (max-aspect-ratio: 64/100) {
      #pack-arrival::before { top: calc(50% + 7.3611vw); height: min(124.49vw, calc(85.9155vh - 66.3459vw)); }
    }
    html[data-pack-scene-ready="true"] #pack-arrival { visibility: hidden; opacity: 0; pointer-events: none; }
    html:not([data-pack-scene-ready="true"]) :is(#catalog-trigger, #pack-select-trigger) { visibility: hidden; }
    @media (prefers-reduced-motion: reduce) { #pack-arrival { transition: none; } }
    #arrival-recovery, #arrival-note {
      position: absolute; inset: auto 0 max(6%, env(safe-area-inset-bottom));
      text-align: center; color: #e9dfc7; font: 14px/1.5 "PingFang SC", sans-serif;
    }
    #arrival-recovery a, #arrival-recovery button {
      display: inline-block; margin: 4px; padding: 9px 15px; border: 1px solid #94815e; border-radius: 3px;
      color: #ead9b5; background: #18271f; font: inherit; text-decoration: none; cursor: pointer;
    }
    #arrival-recovery[hidden] { display: none; }
    #catalog-trigger, #hero-catalog, #pack-select-trigger {
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #e9dfc7;
    }
    #catalog-trigger {
      position: fixed; z-index: 2; left: 50%; transform: translateX(-50%);
      bottom: max(2.9%, env(safe-area-inset-bottom)); min-height: 36px;
      padding: 4px 12px; border: 1px solid #897950; border-radius: 3px;
      background: #1a2923; color: #e5d3ad; font-size: 13px; cursor: pointer;
    }
    #pack-select-trigger {
      position: fixed; z-index: 2; top: max(6.4%, 25px, env(safe-area-inset-top));
      right: max(14%, 68px); transform: translateY(-50%);
      display: inline-flex; align-items: center; min-height: 40px; box-sizing: border-box;
      padding: 0 13px; border: 1px solid #94815e; border-radius: 3px;
      background: #18271ff2; color: #ead9b5; text-decoration: none; font-size: 13px;
    }
    #pack-select-trigger:hover, #pack-select-trigger:focus-visible { border-color: #e3c896; color: #fff0d4; }
    #pack-select-trigger[hidden], #catalog-trigger[hidden] { display: none; }
    @media (max-aspect-ratio: 64/100) {
      #pack-select-trigger {top: max(10vw, 25px, env(safe-area-inset-top));}
    }

  </div>

  <script>
    (async () => {
      if (document.documentElement.dataset.screen !== 'game') return;

      document.body.appendChild(document.getElementById('game-screen').content);
      const recovery = document.getElementById('arrival-recovery');
      const note = document.getElementById('arrival-note');
      const noteTimer = setTimeout(() => {
        if (recovery.hidden && document.documentElement.dataset.packSceneReady !== 'true') note.hidden = false;
      }, 2200);
      const slowStart = setTimeout(() => {
        if (document.documentElement.dataset.packSceneReady === 'true' || !recovery.hidden) return;
        note.hidden = true;
        recovery.querySelector('p').textContent = '牌桌仍在准备中';
        recovery.hidden = false;
      }, 15000);
      window.addEventListener('pack-scene-ready', () => {
        clearTimeout(noteTimer);
        clearTimeout(slowStart);
        note.hidden = true;
        recovery.hidden = true;
      }, {once: true});
      // Preserve the build's script URLs and load order, including its SystemJS import map.
      for (const source of document.getElementById('cocos-bootstrap').content.querySelectorAll('script')) {
        const script = document.createElement('script');
        for (const attr of source.attributes) script.setAttribute(attr.name, attr.value);
        script.textContent = source.textContent;
        const executable = !source.type || source.type === 'text/javascript' || source.type === 'module';
        if (source.src && executable) {
          await new Promise((resolve, reject) => {
            script.onload = resolve;
            script.onerror = () => reject(new Error('无法载入 ' + source.getAttribute('src')));
            document.body.appendChild(script);
          });
        } else {
          document.body.appendChild(script);
        }
      }
    })().catch(error => {
      console.error(error);
      const recovery = document.getElementById('arrival-recovery');
      document.getElementById('arrival-note').hidden = true;
      recovery.querySelector('p').textContent = '牌桌未能载入';
      recovery.hidden = false;
    });
  </script>
</body>
</html>
